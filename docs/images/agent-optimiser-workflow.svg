<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" width="720" height="430" role="img" aria-label="agent-optimiser in one pass: agent files go through a deterministic scanner, a judgement step over the references, a report that stops for approval, and an apply step that bumps versions. Below, one agent from a recorded run: no tools field becomes a six-tool allowlist, the pasted 46-line memory section becomes one line, four description examples become one, a version field appears, and definition text drops from about 2,210 to about 1,056 tokens.">
  <rect x="0" y="0" width="720" height="430" fill="#ffffff" rx="6"/>
  <style>
    .t  { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s  { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
    .h  { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .b  { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .m  { font: 400 11px "SF Mono", Menlo, Consolas, monospace; fill: #475569; }
    .l  { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .v  { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .cap{ font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text class="t" x="24" y="30">agent-optimiser: one pass over .claude/agents/*.md</text>
  <text class="s" x="24" y="50">Scan deterministically, judge against the references, report and stop, apply only what you approve</text>

  <!-- pipeline: 5 boxes, 104 wide, 36 gaps, from x=28 -->
  <rect x="28"  y="72" width="104" height="46" fill="#f1f5f9" stroke="#cbd5e1" rx="3"/>
  <text class="b" x="80"  y="91"  text-anchor="middle">agent files</text>
  <text class="m" x="80"  y="107" text-anchor="middle">*.md</text>

  <rect x="168" y="72" width="104" height="46" fill="#f1f5f9" stroke="#cbd5e1" rx="3"/>
  <text class="b" x="220" y="91"  text-anchor="middle">scan</text>
  <text class="m" x="220" y="107" text-anchor="middle">scan_agents.py</text>

  <rect x="308" y="72" width="104" height="46" fill="#f1f5f9" stroke="#cbd5e1" rx="3"/>
  <text class="b" x="360" y="91"  text-anchor="middle">judge</text>
  <text class="m" x="360" y="107" text-anchor="middle">SKILL + references</text>

  <rect x="448" y="72" width="104" height="46" fill="#ffffff" stroke="#0d9488" stroke-width="1.5" rx="3"/>
  <text class="b" x="500" y="91"  text-anchor="middle" fill="#0d9488">report, then STOP</text>
  <text class="m" x="500" y="107" text-anchor="middle">you approve</text>

  <rect x="588" y="72" width="104" height="46" fill="#f1f5f9" stroke="#cbd5e1" rx="3"/>
  <text class="b" x="640" y="91"  text-anchor="middle">apply</text>
  <text class="m" x="640" y="107" text-anchor="middle">bump_version.py</text>

  <line x1="132" y1="95" x2="166" y2="95" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="272" y1="95" x2="306" y2="95" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="412" y1="95" x2="446" y2="95" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="552" y1="95" x2="586" y2="95" stroke="#64748b" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- what each step produces -->
  <text class="cap" x="80"  y="136" text-anchor="middle">frontmatter + body</text>
  <text class="cap" x="220" y="136" text-anchor="middle">flag codes, sizes,</text>
  <text class="cap" x="220" y="150" text-anchor="middle">duplicated blocks</text>
  <text class="cap" x="360" y="136" text-anchor="middle">which flags to act on;</text>
  <text class="cap" x="360" y="150" text-anchor="middle">unsure tools become questions</text>
  <text class="cap" x="500" y="136" text-anchor="middle">per-agent findings;</text>
  <text class="cap" x="500" y="150" text-anchor="middle">no file changes yet</text>
  <text class="cap" x="640" y="136" text-anchor="middle">approved items only,</text>
  <text class="cap" x="640" y="150" text-anchor="middle">version bumped, rescanned</text>

  <!-- before / after -->
  <line x1="24" y1="176" x2="696" y2="176" stroke="#e2e8f0" stroke-width="1"/>
  <text class="h" x="24" y="200">What to expect: one agent from a recorded run</text>
  <text class="h" x="200" y="226">before</text>
  <text class="h" x="470" y="226">after</text>
  <line x1="24" y1="234" x2="696" y2="234" stroke="#cbd5e1" stroke-width="1"/>

  <text class="l" x="24"  y="256">tools</text>
  <text class="v" x="200" y="256" fill="#b91c1c">no field: inherits every tool</text>
  <text class="v" x="470" y="256" fill="#0d9488">Bash, Read, Grep, Glob, Edit, Write</text>
  <text class="cap" x="470" y="270">Edit + Write kept for memory upkeep</text>

  <text class="l" x="24"  y="294">body</text>
  <text class="v" x="200" y="294">145 lines, 46 of them a pasted memory section</text>
  <text class="v" x="470" y="294">memory section is one line</text>

  <text class="l" x="24"  y="320">description</text>
  <text class="v" x="200" y="320">4 worked examples</text>
  <text class="v" x="470" y="320">1 example, concrete triggers</text>

  <text class="l" x="24"  y="346">version</text>
  <text class="v" x="200" y="346">none</text>
  <text class="v" x="470" y="346">1.1.0</text>

  <text class="l" x="24"  y="372">definition text</text>
  <text class="v" x="200" y="372">~2,210 tokens</text>
  <text class="v" x="470" y="372">~1,056 tokens</text>

  <line x1="24" y1="386" x2="696" y2="386" stroke="#cbd5e1" stroke-width="1"/>
  <text class="cap" x="24" y="404">Definition text is chars/4 of the agent file (frontmatter + body); it is what the scanner measures.</text>
  <text class="cap" x="24" y="418">The allowlist also stops every unused tool schema loading at launch, which the scanner does not count.</text>
</svg>
