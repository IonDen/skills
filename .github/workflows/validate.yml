name: validate

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python3 -m pip install pyyaml pytest
      - name: Check skill layout
        run: python3 scripts/validate_skills.py
      - name: Validate against the Agent Skills spec
        if: matrix.python-version == '3.12'
        run: |
          python3 -m pip install skills-ref
          agentskills validate ./skills/subagent-optimizer
          agentskills validate ./skills/skill-optimizer
      - name: Tests
        run: python3 -m pytest tests -q
