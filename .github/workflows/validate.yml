name: validate

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python3 -m pip install pyyaml pytest skills-ref
      - name: Check skill layout
        run: python3 scripts/validate_skills.py
      - name: Validate against the Agent Skills spec
        run: agentskills validate ./skills/agent-optimiser
      - name: Tests
        run: python3 -m pytest tests -q
