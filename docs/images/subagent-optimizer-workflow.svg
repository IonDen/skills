<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="720" height="470" role="img" aria-label="Measured first-request input tokens of a Claude Code subagent. Controlled probe: on Haiku 4.5 an agent with no tools field costs 18,437 tokens and the same agent with a three-tool allowlist costs 10,241; on Sonnet 5, 31,882 versus 13,401. Three real agents optimised by the skill, same model before and after: bash-git-ops on Haiku 20,122 to 13,962; plan-driven-coder on Sonnet 34,134 to 29,734, and the before version also spawned a nested subagent costing 24,333 more; solution-architect on Opus 28,688 to 27,893. All tasks produced equivalent results.">
  <rect x="0" y="0" width="720" height="470" fill="#ffffff" rx="6"/>
  <style>
    .t  { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s  { font: 400 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #475569; }
    .h  { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .l  { font: 500 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .v  { font: 600 12.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0f172a; }
    .ax { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
    .cap{ font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #64748b; }
  </style>

  <text class="t" x="24" y="30">What a subagent costs to launch, before and after subagent-optimizer</text>
  <text class="s" x="24" y="50">Input tokens of the subagent's first API request, measured with Claude Code 2.1.278</text>
  <text class="s" x="24" y="66">(system prompt, tool schemas, CLAUDE.md, agent body, task)</text>

  <!-- scale: 0..36,000 tokens over x=230..660 (430px) => 0.011944 px/token -->
  <!-- panel 1: controlled probe -->
  <text class="h" x="24" y="88">Same tiny agent, no tools field vs a three-tool allowlist</text>

  <text class="l" x="220" y="111" text-anchor="end">Haiku 4.5, no tools field</text>
  <rect x="230" y="98" width="220.2" height="18" fill="#dc2626" rx="2"/>
  <text class="v" x="456" y="112">18,437</text>
  <text class="l" x="220" y="133" text-anchor="end">Haiku 4.5, Read Grep Glob</text>
  <rect x="230" y="120" width="122.3" height="18" fill="#0d9488" rx="2"/>
  <text class="v" x="358" y="134">10,241  (−44%)</text>

  <text class="l" x="220" y="163" text-anchor="end">Sonnet 5, no tools field</text>
  <rect x="230" y="150" width="380.8" height="18" fill="#dc2626" rx="2"/>
  <text class="v" x="617" y="164">31,882</text>
  <text class="l" x="220" y="185" text-anchor="end">Sonnet 5, Read Grep Glob</text>
  <rect x="230" y="172" width="160.1" height="18" fill="#0d9488" rx="2"/>
  <text class="v" x="396" y="186">13,401  (−58%)</text>

  <!-- panel 2: real agents -->
  <text class="h" x="24" y="222">Three real agents optimised by the skill, same model before and after</text>

  <text class="l" x="220" y="249" text-anchor="end">bash-git-ops, Haiku</text>
  <rect x="230" y="236" width="240.3" height="18" fill="#dc2626" rx="2"/>
  <text class="v" x="476" y="250">20,122</text>
  <rect x="230" y="258" width="166.8" height="18" fill="#0d9488" rx="2"/>
  <text class="v" x="402" y="272">13,962  (−31%)</text>

  <text class="l" x="220" y="301" text-anchor="end">plan-driven-coder, Sonnet</text>
  <rect x="230" y="288" width="407.7" height="18" fill="#dc2626" rx="2"/>
  <text class="v" x="643" y="302">34,134</text>
  <rect x="230" y="310" width="355.2" height="18" fill="#0d9488" rx="2"/>
  <text class="v" x="591" y="324">29,734  (−13%)</text>
  <text class="cap" x="230" y="341">before: inherited `Agent` and spawned a nested subagent the task did not need, +24,333 tokens;</text>
  <text class="cap" x="230" y="354">after: ran the tests itself</text>

  <text class="l" x="220" y="373" text-anchor="end">solution-architect, Opus</text>
  <rect x="230" y="360" width="342.7" height="18" fill="#dc2626" rx="2"/>
  <text class="v" x="578" y="374">28,688</text>
  <rect x="230" y="382" width="333.2" height="18" fill="#0d9488" rx="2"/>
  <text class="v" x="569" y="396">27,893  (−3%)</text>

  <!-- axis -->
  <line x1="230" y1="410" x2="660" y2="410" stroke="#cbd5e1" stroke-width="1"/>
  <text class="ax" x="230" y="424" text-anchor="middle">0</text>
  <text class="ax" x="349.4" y="424" text-anchor="middle">10k</text>
  <text class="ax" x="468.9" y="424" text-anchor="middle">20k</text>
  <text class="ax" x="588.3" y="424" text-anchor="middle">30k</text>
  <text class="ax" x="660" y="424" text-anchor="middle">36k tokens</text>

  <rect x="230" y="438" width="11" height="11" fill="#dc2626" rx="2"/>
  <text class="cap" x="247" y="448">before: no `tools` field (inherits every tool) or the original file</text>
  <rect x="230" y="454" width="11" height="11" fill="#0d9488" rx="2"/>
  <text class="cap" x="247" y="464">after: allowlist and trims applied; the three tasks produced equivalent results with both versions</text>
</svg>
